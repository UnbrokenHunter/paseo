name: NPM Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.3.0-beta.1)"
        required: true
        type: string

concurrency:
  group: npm-publish-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  # This fork publishes under a scope it owns; @getpaseo belongs to upstream.
  # See scripts/rewrite-npm-scope.mjs.
  PASEO_NPM_SCOPE: "@unbrokenhunter_"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install JS dependencies
        run: npm ci

      - name: Rewrite npm scope
        run: node scripts/rewrite-npm-scope.mjs

      - name: Publish packages
        shell: bash
        # Trusted publishing (OIDC) cannot be registered for a package that does not
        # exist yet, so the first publish of each package needs NPM_TOKEN. npm prefers
        # OIDC once a trusted publisher is configured, and the secret becomes unused.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          publish_args=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            publish_args=(--tag beta)
          fi

          # Selected by path, not by name: the scope rewrite already renamed them.
          for workspace in highlight relay protocol client server cli; do
            npm publish --workspace="packages/$workspace" --access public "${publish_args[@]}"
          done
